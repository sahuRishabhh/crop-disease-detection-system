model:
  name: "mobilenet_v2"
  pretrained: true
  num_classes: null # Inferred from dataset

dataset:
  root_dir: "data/fixtures"
  input_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

training:
  epochs: 5
  batch_size: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  random_seed: 42
  early_stopping_patience: 3

paths:
  checkpoint_dir: "models"
  output_dir: "outputs"
